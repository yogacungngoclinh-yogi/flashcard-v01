<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bé Học Tiếng Anh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--nen:#FFF8EC;--chu:#3B2F4A;--phu:#8A7F96;--the:#fff;--bong:0 8px 0 rgba(59,47,74,.12);--vi:#00796B;--dung:#4CAF50;--sai:#FF7043}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%}
body{background:var(--nen);color:var(--chu);font-family:"Baloo 2",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.man{position:fixed;inset:0;display:none;flex-direction:column;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
.man.hien{display:flex}
.dau{display:flex;align-items:center;gap:12px;min-height:56px}
.dau h1{margin:0;font-size:clamp(24px,6vw,36px);font-weight:800;flex:1;line-height:1.1}
.nut-tron{width:56px;height:56px;border-radius:50%;background:var(--the);box-shadow:var(--bong);font-size:26px;display:grid;place-items:center;flex:none}
.nut-tron:active,.o:active,.lua-chon:active,.nut-to:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(59,47,74,.12)}
/* Trang chủ */
.luoi{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;padding:8px 2px 24px;align-content:start}
.o{background:var(--mau);border-radius:28px;box-shadow:var(--bong);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;position:relative}
.o .bieu{font-size:clamp(56px,14vw,80px);line-height:1}
.o .ten{font-size:24px;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.o .vi{font-size:19px;font-weight:800;margin-top:-2px;background:rgba(255,255,255,.88);color:var(--vi);border-radius:99px;padding:1px 12px}
.o .sao{position:absolute;top:10px;right:12px;font-size:16px;letter-spacing:-2px}
/* Học thẻ */
.khung-the{flex:1;display:grid;place-items:center;min-height:0;touch-action:pan-y}
.the{width:min(92vw,460px,62vh);aspect-ratio:3/4;background:var(--the);border-radius:36px;box-shadow:0 10px 0 var(--mau),0 14px 30px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6%;gap:2%;transition:transform .25s}
.the.vao{animation:vao .35s ease-out}
@keyframes vao{from{transform:scale(.85) rotate(-3deg);opacity:0}}
.the.nay{animation:nay .4s}
@keyframes nay{40%{transform:scale(1.05)}}
.hinh{flex:1;width:100%;display:grid;place-items:center;min-height:0}
.hinh img{max-width:100%;max-height:100%;object-fit:contain;border-radius:20px}
.hinh .em{font-size:min(38vw,190px,25vh);line-height:1}
.chu-en{font-size:clamp(44px,12vw,72px);font-weight:800;line-height:1;color:var(--mau)}
.chu-vi{font-size:clamp(26px,7.5vw,40px);font-weight:800;color:var(--vi);line-height:1.1;text-align:center}
.loa{font-size:20px;color:var(--phu)}
.dieu-khien{display:flex;align-items:center;justify-content:center;gap:20px;padding:12px 0 max(12px,env(safe-area-inset-bottom))}
.dieu-khien .nut-tron{width:72px;height:72px;font-size:34px}
.cham{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:200px}
.cham i{width:10px;height:10px;border-radius:50%;background:#e5dccd}
.cham i.da{background:var(--mau)}
.nut-to{background:var(--mau);color:#fff;border-radius:999px;padding:12px 28px;font-size:24px;font-weight:800;box-shadow:var(--bong)}
/* Kiểm tra */
.tien-do{height:16px;background:#eee3d2;border-radius:99px;overflow:hidden;flex:1}
.tien-do b{display:block;height:100%;width:0;background:var(--mau);border-radius:99px;transition:width .4s}
.cau-hoi{text-align:center;padding:6px 0 4px}
.cau-hoi .nut-tron{width:min(36vw,150px);height:min(36vw,150px);font-size:min(18vw,76px);margin:6px auto 0;background:var(--mau);color:#fff}
.cau-hoi p{margin:6px 0 0;color:var(--phu);font-size:16px}
.cau-chu{line-height:1.1}
.cau-chu .en{font-size:clamp(26px,7.5vw,40px);font-weight:800;color:var(--chu)}
.cau-chu .vi{font-size:clamp(18px,5vw,26px);font-weight:800;color:var(--vi);margin-top:2px}
.hang-hoi{display:flex;align-items:center;justify-content:center;gap:10px;max-width:560px;margin:0 auto}
.hang-hoi .nv-nho{font-size:52px;line-height:1;flex:none}
.hang-hoi .nv-nho img{height:72px;width:auto;border-radius:16px}
.hang-hoi .cau-chu{text-align:left}
.nhan-dung{position:absolute;left:6px;right:6px;bottom:6px;background:var(--dung);color:#fff;border-radius:16px;padding:2px 6px;font-size:clamp(22px,6.5vw,34px);font-weight:800;line-height:1.15;text-align:center;z-index:2;animation:vao .3s ease-out}
.dap-an{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-content:center;min-height:0}
@media (max-aspect-ratio:3/4){.dap-an{grid-template-columns:1fr 1fr}.dap-an .lua-chon:nth-child(3){grid-column:1/3;width:50%;justify-self:center}}
.lua-chon{background:var(--the);border-radius:28px;box-shadow:var(--bong);aspect-ratio:1;display:grid;place-items:center;padding:10%;border:5px solid transparent;transition:opacity .3s}
.lua-chon img{max-width:100%;max-height:100%;object-fit:contain}
.lua-chon .em{font-size:min(20vw,110px,16vh)}
.lua-chon{position:relative}
.lua-chon.dung{border-color:var(--dung);animation:chop .7s ease-in-out infinite}
.lua-chon.dung::after{content:"👇";position:absolute;top:-34px;left:50%;margin-left:-20px;font-size:38px;line-height:1;animation:nhun .6s ease-in-out infinite}
.dap-an.xong .lua-chon:not(.dung){opacity:.2;transition:opacity .3s}
@keyframes chop{0%,100%{box-shadow:var(--bong);background:#fff}50%{box-shadow:0 0 0 12px rgba(76,175,80,.45),var(--bong);background:#E8F5E9}}
@keyframes nhun{50%{transform:translateY(8px)}}
.lua-chon.sai{animation:lac .4s;border-color:#E53935}
.lua-chon.sai>*{opacity:.3}
.lua-chon.sai::before{content:"✖";position:absolute;inset:0;display:grid;place-items:center;font-size:min(22vw,96px);font-weight:800;color:#E53935;text-shadow:0 2px 0 #fff;z-index:1;pointer-events:none}
@keyframes lac{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
/* Kết quả */
.ket-qua{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.ket-qua .sao-to{font-size:clamp(56px,16vw,96px);letter-spacing:4px}
.ket-qua .sao-to span{display:inline-block;animation:vao .5s backwards}
.ket-qua h2{margin:0;font-size:40px}
.ket-qua p{margin:0;color:var(--phu);font-size:20px}
.phao{position:fixed;font-size:32px;pointer-events:none;animation:roi 1.4s ease-in forwards;z-index:9}
@keyframes roi{to{transform:translateY(110vh) rotate(540deg)}}
.thuong-hieu{text-align:center;color:var(--phu);font-size:13px;padding-bottom:env(safe-area-inset-bottom)}

/* Tab trang chủ + Nói chuyện */
.tab{display:flex;gap:10px;padding:4px 0 8px}
.tab button{flex:1;background:var(--the);border-radius:22px;box-shadow:var(--bong);padding:12px 6px;font-size:20px;font-weight:800;color:var(--phu);border:4px solid transparent;line-height:1.1}
.tab button.chon{color:var(--chu);border-color:#FFB74D;background:#FFF1D6}
.tab button small{display:block;font-size:15px;font-weight:700;color:var(--vi)}
.khu{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.khu::-webkit-scrollbar{display:none}
.khu button{flex:none;background:var(--the);border-radius:99px;box-shadow:0 4px 0 rgba(59,47,74,.12);padding:8px 16px;font-size:18px;font-weight:800;color:var(--phu);white-space:nowrap}
.khu button.chon{color:#fff;background:var(--chu)}
.o.chu .bieu{font-weight:800;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.15)}
.the-vd{font-size:clamp(20px,5.5vw,28px);font-weight:700;color:var(--chu);text-align:center;line-height:1.15}
.the-vd:empty{display:none}
.lua-chon .chu-to{font-size:clamp(40px,12vw,72px);font-weight:800;color:var(--chu);line-height:1}
.xc-dong{min-height:110px;background:var(--the);border-radius:24px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;border:4px dashed #e5dccd;margin-top:8px}
.xc-kho{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:16px 0;min-height:70px}
.the-tu{background:#fff;border-radius:16px;box-shadow:0 4px 0 rgba(59,47,74,.15);padding:10px 14px;font-size:clamp(20px,5.5vw,28px);font-weight:800;border:3px solid var(--mau)}
.xc-dong .the-tu{background:#FFF8E1;box-shadow:none}
.xc-dong.dung{border:4px solid var(--dung);background:#E8F5E9}
.xc-dong.sai{animation:lac .4s;border-color:#E53935}
.o.bai .nv{position:absolute;top:8px;left:12px;font-size:30px}
.o.bai .ten{font-size:20px;text-align:center;padding:0 8px;line-height:1.05}
.canh{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:0;padding:0 2px}
.nv-to{font-size:min(30vw,150px,18vh);line-height:1}
.nv-to img{height:min(34vw,150px,20vh);width:auto;border-radius:24px}
.bong{max-width:520px;width:100%;background:var(--the);border-radius:28px;box-shadow:var(--bong);padding:16px 20px;text-align:center;border:5px solid var(--mau)}
.bong .en{font-size:clamp(26px,7vw,40px);font-weight:800;line-height:1.1}
.bong .vi{color:var(--vi);font-size:clamp(20px,5.5vw,28px);font-weight:800;margin-top:6px;line-height:1.15}
.bong.be{border-color:#4FC3F7;background:#F3FBFF}
.bong .loa{font-size:20px;color:var(--phu)}
.bong .e{font-size:44px;line-height:1.1}
.bong .e img{height:84px;border-radius:16px}
.hanh{display:flex;gap:14px;justify-content:center;padding:10px 0 max(14px,env(safe-area-inset-bottom));flex-wrap:wrap}
.nut-to.xanh{background:#4CAF50}
.dap-an.chu .lua-chon{aspect-ratio:auto;padding:14px 8px;gap:6px;align-content:center}
.dap-an.chu .lua-chon .em{font-size:min(14vw,60px);display:block}
.dap-an.chu .lua-chon b{display:block;font-size:clamp(16px,4.2vw,22px);line-height:1.1}
.dap-an.chu .lua-chon img{max-height:70px;border-radius:12px}
@media (max-aspect-ratio:3/4){.dap-an.chu{grid-template-columns:1fr}.dap-an.chu .lua-chon:nth-child(3){grid-column:auto;width:auto}.dap-an.chu .lua-chon{display:flex;align-items:center;gap:12px;justify-content:flex-start;padding:10px 16px}.dap-an.chu .lua-chon b{text-align:left}}
</style>
</head>
<body>

<section class="man hien" id="trang-chu">
  <div class="dau"><h1>Bé Học Tiếng Anh 🌈</h1></div>
  <div class="tab"><button id="tuoi-5">🧒 Bé 5 tuổi<small>Mầm non · Starters</small></button><button id="tuoi-10">👦 Bé 10 tuổi<small>Giao tiếp · Movers</small></button></div>
  <div class="khu" id="khu"></div>
  <div class="luoi" id="luoi"></div>
  <div class="thuong-hieu">Chạm vào một chủ đề để học nhé!</div>
</section>

<section class="man" id="hoc">
  <div class="dau">
    <button class="nut-tron" data-ve aria-label="Về trang chủ">🏠</button>
    <h1 id="hoc-ten"></h1>
    <button class="nut-tron" id="vao-kt" aria-label="Kiểm tra">⭐</button>
  </div>
  <div class="khung-the" id="khung-the">
    <button class="the" id="the" aria-label="Nghe đọc">
      <div class="hinh" id="the-hinh"></div>
      <div class="chu-en" id="the-en"></div>
      <div class="chu-vi" id="the-vi"></div>
      <div class="the-vd" id="the-vd"></div>
      <div class="loa">🔊 chạm để nghe</div>
    </button>
  </div>
  <div class="dieu-khien">
    <button class="nut-tron" id="truoc" aria-label="Thẻ trước">⬅️</button>
    <div class="cham" id="cham"></div>
    <button class="nut-tron" id="sau" aria-label="Thẻ sau">➡️</button>
  </div>
</section>

<section class="man" id="kiem-tra">
  <div class="dau">
    <button class="nut-tron" data-ve aria-label="Về trang chủ">🏠</button>
    <div class="tien-do"><b id="tien-do"></b></div>
  </div>
  <div class="cau-hoi">
    <div class="cau-chu"><div class="en" id="kt-hoi"></div><div class="vi" id="kt-hoivi"></div></div>
    <button class="nut-tron" id="nghe-lai" aria-label="Nghe lại">🔊</button>
    <p>Chạm loa để nghe lại</p>

</section>

<section class="man" id="gt-hoc">
  <div class="dau">
    <button class="nut-tron" data-ve aria-label="Về trang chủ">🏠</button>
    <h1 id="gt-ten"></h1>
    <div class="cham" id="gt-cham" style="max-width:90px"></div>
  </div>
  <div class="canh">
    <div class="nv-to" id="gt-nv"></div>
    <button class="bong" id="gt-q"><div class="en" id="gt-q-en"></div><div class="vi" id="gt-q-vi"></div><div class="loa">🔊 chạm để nghe</div></button>
    <button class="bong be" id="gt-a"><div class="e" id="gt-a-e" style="white-space:nowrap"></div><div class="en" id="gt-a-en"></div><div class="vi" id="gt-a-vi"></div><div class="loa">🔊 Bé nói theo nhé!</div></button>
  </div>
  <div class="hanh"><button class="nut-to xanh" id="gt-xong-noi">🎤 Con nói xong rồi!</button></div>
</section>

<section class="man" id="gt-kt">
  <div class="dau">
    <button class="nut-tron" data-ve aria-label="Về trang chủ">🏠</button>
    <div class="tien-do"><b id="gt-tien-do"></b></div>
  </div>
  <div class="cau-hoi">
    <div class="hang-hoi"><div class="nv-nho" id="gt-kt-nv"></div><div class="cau-chu"><div class="en" id="gt-kt-q"></div><div class="vi" id="gt-kt-qvi"></div></div></div>
    <button class="nut-tron" id="gt-nghe-lai" aria-label="Nghe lại">🔊</button>
    <p>Chọn câu trả lời đúng</p>
  </div>
  <div class="dap-an chu" id="gt-dap-an"></div>
</section>

<section class="man" id="xc">
  <div class="dau">
    <button class="nut-tron" data-ve aria-label="Về trang chủ">🏠</button>
    <div class="tien-do"><b id="xc-tien-do"></b></div>
  </div>
  <div class="cau-hoi">
    <div class="cau-chu"><div class="vi" id="xc-vi"></div></div>
    <button class="nut-tron" id="xc-nghe" aria-label="Nghe câu" style="width:96px;height:96px;font-size:46px">🔊</button>

  </div>
  <div class="xc-dong" id="xc-dong"></div>
  <div class="xc-kho" id="xc-kho"></div>
  <div class="hanh"><button class="nut-to" id="xc-xoa" style="background:#90A4AE">↩️ Xếp lại</button></div>
</section>

<section class="man" id="xong">
  <div class="ket-qua">
    <div class="sao-to" id="sao-to"></div>
    <h2 id="xong-loi"></h2>
    <p id="xong-phu"></p>
    <button class="nut-to" id="hoc-lai">Học lại 📖</button>
    <button class="nut-to" id="choi-lai" style="background:#4FC3F7">Kiểm tra lại ⭐</button>
    <button class="nut-tron" data-ve aria-label="Về trang chủ">🏠</button>
  </div>
</section>

<script src="giao-tiep.js?v=20261106d"></script>
<script src="chu-cai.js?v=20261106d"></script>
<script src="tinh-huong.js?v=20261106d"></script>
<script src="mau-cau.js?v=20261106d"></script>

<script src="thoi-gian.js?v=20261106d"></script>

<script>
const $ = s => document.querySelector(s);
const SO_CAU = 8;
let kieu = "tv", bai, luot = 0, cauGt = [], soGt = 0, dungGt = 0, saiGt = false, khoaGt = false;
let chuDe, viTri = 0, cau = [], soCau = 0, dungLanDau = 0, saiCauNay = false, khoa = false;

// ---- lưu sao ----
const docSao = () => { try { return JSON.parse(localStorage.getItem("sao") || "{}"); } catch { return {}; } };
const ghiSao = (id, n) => { try { const s = docSao(); s[id] = Math.max(s[id] || 0, n); localStorage.setItem("sao", JSON.stringify(s)); } catch {} };

// ---- âm thanh ----
// Một bộ phát tiếng duy nhất, mở khóa ở lần chạm đầu → điện thoại cho phát tự động ở các câu sau
const am = new Audio();
const IM = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
let moKhoa = false;
function moKhoaAm() {
  if (moKhoa || am.getAttribute("src")) return; moKhoa = true;
  am.src = IM; am.play().catch(() => {});
}
["pointerdown", "touchstart", "click", "keydown"].forEach(ev => document.addEventListener(ev, moKhoaAm, { once: false, passive: true }));
// Phát lần lượt nhiều tiếng; xong hết (hoặc quá 8s) mới gọi xong() đúng 1 lần
let tokChuoi = 0;
function phatLanLuot(ds, xong) {
  const k = ++tokChuoi; let i = 0, daXong = false;
  const fin = () => { if (daXong || k !== tokChuoi) return; daXong = true; xong(); };
  const buoc = () => {
    if (k !== tokChuoi) return;
    if (i >= ds.length) return void setTimeout(fin, 300);
    const [id, chu] = ds[i++];
    phat(id, chu).onended = () => setTimeout(buoc, 250);
  };
  buoc(); setTimeout(fin, 5000);
}
// Tải sẵn file tiếng để bấm là phát ngay
const daNap = new Set();
function napAm(ids) { ids.forEach(id => { if (daNap.has(id)) return; daNap.add(id); fetch("am-thanh/" + id + ".mp3").catch(() => {}); }); }
// Tiếng hiệu ứng nhỏ (tự tạo, không cần file): đúng = chuông vui, sai = "ten ten"
let ac;
function nhac(not, kieuSong, am, cach, dai) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    let t = ac.currentTime + 0.02;
    not.forEach(f => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = kieuSong; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(am, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dai);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dai + 0.05);
      t += cach;
    });
  } catch {}
}
const tiengDung = () => nhac([523, 659, 784, 1047, 1319], "triangle", 0.07, 0.08, 0.3);
const tiengSai = () => nhac([440, 311], "square", 0.035, 0.22, 0.26);
function phat(id, chu) {
  am.pause(); am.onended = null;
  am.onerror = () => noi(chu);
  am.src = "am-thanh/" + id + ".mp3";
  am.currentTime = 0;
  am.play().catch(() => {});
  return am;
}
function noi(chu) {
  if (!chu || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(chu); u.lang = "en-US"; u.rate = .8;
  speechSynthesis.speak(u);
}
function hinhTu(tu, lop) {
  // Ảnh thật hinh/<anh hoặc id>.jpg, chưa có thì dùng emoji; anh = "" → dùng emoji luôn
  const a = tu.anh !== undefined ? tu.anh : tu.id;
  if (!a) return `<span class="em ${lop || ""}">${tu.emoji}</span>`;
  return `<img src="hinh/${a}.jpg" alt="${tu.en}" onerror="this.outerHTML='<span class=&quot;em ${lop||""}&quot;>${tu.emoji}</span>'">`;
}

// ---- màn hình ----
function sang(id) { document.querySelectorAll(".man").forEach(m => m.classList.toggle("hien", m.id === id)); }
// Trang chủ: chọn tuổi → chọn khu → lưới bài
const KHU = {
  "5": [["lt", "🗺️ Lộ trình"], ["abc", "🔤 ABC"], ["sight", "👀 Sight words"], ["tv", "📚 Từ vựng"], ["truyen", "📖 Truyện"], ["gt", "💬 Nói chuyện"]],
  "10": [["th", "🗣️ Tình huống"], ["mc", "🔁 Mẫu câu"], ["xc", "🧩 Xếp câu"], ["dt", "✍️ Điền từ"], ["doc", "📰 Bài đọc"], ["truyen", "📖 Truyện"], ["tv", "📚 Từ vựng"]],
};
const nho = (k, mac) => { try { return localStorage.getItem(k) || mac; } catch { return mac; } };
const ghiNho = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
let tuoi = nho("tuoi", "5"), khu = nho("khu-" + tuoi, KHU[tuoi][0][0]);
const oChuDe = (c, sao) => `<button class="o ${c.kieu || ""}" style="--mau:${c.mau}" data-cd="${c.id}">
      <span class="sao">${"⭐".repeat(sao[c.id] || 0)}</span>
      <span class="bieu">${c.emoji}</span><span class="ten">${c.ten}</span><span class="vi">${c.vi}</span></button>`;
const oBai = (b, sao, xc) => `<button class="o bai" style="--mau:${b.mau}" ${xc ? "data-xc" : "data-bai"}="${b.id}">
      <span class="sao">${"⭐".repeat(sao[(xc ? "xc-" : "gt-") + b.id] || 0)}</span>
      <span class="bieu">${xc ? "🧩" : b.emoji}</span><span class="ten">${b.ten}</span><span class="vi">${b.vi}</span><span class="nv">${xc ? b.emoji : b.nv.emoji}</span></button>`;
function veTrangChu() {
  const sao = docSao();
  if (!KHU[tuoi].some(k => k[0] === khu)) khu = KHU[tuoi][0][0];
  $("#tuoi-5").classList.toggle("chon", tuoi === "5"); $("#tuoi-10").classList.toggle("chon", tuoi === "10");
  $("#khu").innerHTML = KHU[tuoi].map(([id, ten]) => `<button data-khu="${id}" class="${id === khu ? "chon" : ""}">${ten}</button>`).join("");
  $("#luoi").classList.toggle("lt", khu === "lt");
  const them = veKhuThem(khu, sao);
  if (them !== null) { $("#luoi").innerHTML = them; sang("trang-chu"); return; }
  const ds = khu === "tv" ? TU_VUNG.map(c => oChuDe(c, sao))
    : khu === "abc" || khu === "sight" ? CHU_CAI.filter(c => c.khu === khu).map(c => oChuDe(c, sao))
    : khu === "gt" ? GIAO_TIEP.map(b => oBai(b, sao))
    : khu === "th" ? TINH_HUONG.map(b => oBai(b, sao))
    : TINH_HUONG.map(b => oBai(b, sao, true));
  $("#luoi").innerHTML = ds.join("");
  sang("trang-chu");
}
$("#tuoi-5").onclick = () => { tuoi = "5"; ghiNho("tuoi", tuoi); khu = nho("khu-5", "abc"); veTrangChu(); };
$("#tuoi-10").onclick = () => { tuoi = "10"; ghiNho("tuoi", tuoi); khu = nho("khu-10", "th"); veTrangChu(); };
$("#khu").onclick = e => { const b = e.target.closest("[data-khu]"); if (!b) return; khu = b.dataset.khu; ghiNho("khu-" + tuoi, khu); veTrangChu(); };
$("#luoi").onclick = e => { if (bamThem(e)) return; const o = e.target.closest(".o"); if (!o) return; o.dataset.xc ? moXc(o.dataset.xc) : o.dataset.bai ? moBai(o.dataset.bai) : moChuDe(o.dataset.cd); };
document.querySelectorAll("[data-ve]").forEach(b => b.onclick = veTrangChu);

function moChuDe(id) {
  chuDe = TU_VUNG.concat(CHU_CAI).find(c => c.id === id);
  document.body.style.setProperty("--mau", chuDe.mau);
  $("#hoc-ten").textContent = chuDe.emoji + " " + chuDe.ten;
  viTri = 0; sang("hoc"); veThe();
}

// ---- học thẻ ----
function veThe() {
  const tu = chuDe.tu[viTri], the = $("#the");
  $("#the-hinh").innerHTML = hinhTu(tu);
  $("#the-en").textContent = tu.en;
  $("#the-vi").textContent = tu.vi;
  $("#the-vd").textContent = tu.vd || "";
  $("#cham").innerHTML = chuDe.tu.map((_, i) => `<i class="${i <= viTri ? "da" : ""}"></i>`).join("");
  $("#truoc").style.visibility = viTri ? "visible" : "hidden";
  $("#sau").textContent = viTri === chuDe.tu.length - 1 ? "⭐" : "➡️";
  the.classList.remove("vao"); void the.offsetWidth; the.classList.add("vao");
  setTimeout(() => { if ($("#hoc").classList.contains("hien") && chuDe.tu[viTri] === tu) phat(tu.id, tu.en); }, 300);
}
$("#the").onclick = () => {
  const tu = chuDe.tu[viTri], the = $("#the");
  the.classList.remove("nay"); void the.offsetWidth; the.classList.add("nay");
  phat(tu.id, tu.en);
};
const sau = () => { if (viTri < chuDe.tu.length - 1) { viTri++; veThe(); } else batDauKT(); };
const truoc = () => { if (viTri > 0) { viTri--; veThe(); } };
$("#sau").onclick = sau; $("#truoc").onclick = truoc;
let x0 = null;
$("#khung-the").addEventListener("touchstart", e => x0 = e.touches[0].clientX, { passive: true });
$("#khung-the").addEventListener("touchend", e => {
  if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (dx < -50) sau(); else if (dx > 50) truoc();
});
document.addEventListener("keydown", e => { if ($("#hoc").classList.contains("hien")) { if (e.key === "ArrowRight") sau(); if (e.key === "ArrowLeft") truoc(); } });
$("#vao-kt").onclick = () => batDauKT();

// ---- kiểm tra ----
const tron = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
const amHoi = t => chuDe.kieu === "chu" && t.docNgan ? t.id + "-w" : t.id;  // ABC/Sight: bài kiểm tra đọc chữ ngắn
function batDauKT() {
  kieu = "tv";
  cau = tron(chuDe.tu).slice(0, SO_CAU); soCau = 0; dungLanDau = 0;
  napAm(cau.flatMap(t => [t.id, amHoi(t)]));
  $("#kt-hoi").textContent = chuDe.hoi || "What is it?"; $("#kt-hoivi").textContent = chuDe.hoivi || "Đây là gì?";
  sang("kiem-tra"); veCau();
}
function veCau() {
  khoa = false; saiCauNay = false; $("#dap-an").classList.remove("xong");
  const tu = cau[soCau];
  const nhieu = tron(chuDe.tu.filter(t => t.id !== tu.id)).slice(0, 2);
  const lua = tron([tu, ...nhieu]);
  $("#tien-do").style.width = (soCau / cau.length * 100) + "%";
  $("#dap-an").innerHTML = lua.map(t => `<button class="lua-chon" data-id="${t.id}">${chuDe.kieu === "chu" ? `<span class="chu-to">${t.en}</span>` : hinhTu(t)}</button>`).join("");
  // hiện hình là đọc luôn
  setTimeout(() => { if (cau[soCau] === tu && !khoa) phat(amHoi(tu), tu.en); }, 120);
}
$("#nghe-lai").onclick = () => { const tu = cau[soCau]; phat(amHoi(tu), tu.en); };
$("#dap-an").onclick = e => {
  const b = e.target.closest(".lua-chon"); if (!b || khoa || b.classList.contains("sai")) return;
  const tu = cau[soCau];
  if (b.dataset.id === tu.id) {
    khoa = true; b.classList.add("dung");
    const nhan = chuDe.kieu !== "chu" ? tu.en : tu.vi.split(" · ")[0];
    b.insertAdjacentHTML("beforeend", `<span class="nhan-dung">${nhan}</span>`); $("#dap-an").classList.add("xong"); if (!saiCauNay) dungLanDau++;
    phao(12); tiengDung();
    phatLanLuot([[tu.id, tu.en]], () => {
      if (!$("#kiem-tra").classList.contains("hien")) return;
      soCau++; soCau < cau.length ? veCau() : ketThuc();
    });
  } else {
    saiCauNay = true; b.classList.add("sai"); tiengSai();
  }
};
function ketThuc() {
  $("#tien-do").style.width = "100%";
  const n = dungLanDau >= cau.length - 1 ? 3 : dungLanDau >= cau.length / 2 ? 2 : 1;
  ghiSao(chuDe.id, n);
  $("#sao-to").innerHTML = [0, 1, 2].map(i => `<span style="animation-delay:${i * .25}s;${i < n ? "" : "filter:grayscale(1);opacity:.3"}">⭐</span>`).join("");
  $("#xong-loi").textContent = ["", "Cố lên nào!", "Giỏi lắm!", "Xuất sắc!"][n];
  $("#xong-phu").textContent = `Bé đúng ngay ${dungLanDau}/${cau.length} câu`;
  sang("xong"); phao(24); phat("_well-done", "Well done! You did it!");
}
$("#hoc-lai").onclick = () => lamLai[kieu] ? lamLai[kieu].hoc() : kieu === "gt" ? moBai(bai.id) : kieu === "xc" ? moBai(xcBai.id) : moChuDe(chuDe.id);
$("#choi-lai").onclick = () => lamLai[kieu] ? lamLai[kieu].choi() : kieu === "gt" ? ktBai() : kieu === "xc" ? moXc(xcBai.id) : batDauKT();
function phao(n) {
  const d = ["⭐", "🎉", "✨", "🌟", "🎈"];
  for (let i = 0; i < n; i++) {
    const s = document.createElement("div"); s.className = "phao";
    s.textContent = d[i % d.length]; s.style.left = Math.random() * 100 + "vw"; s.style.top = "-40px";
    s.style.animationDelay = Math.random() * .4 + "s"; document.body.appendChild(s);
    setTimeout(() => s.remove(), 2000);
  }
}
// ---- Nói chuyện ----
const anhGt = (id, em) => `<img src="hinh/${id}.jpg" alt="" onerror="this.outerHTML='${em}'">`;
function moBai(id) {
  bai = GIAO_TIEP.concat(TINH_HUONG).find(b => b.id === id); kieu = "gt";
  document.body.style.setProperty("--mau", bai.mau);
  $("#gt-ten").textContent = bai.emoji + " " + bai.ten;
  luot = 0; sang("gt-hoc"); veLuot();
}
let chuoiAm = 0;
function veLuot() {
  const l = bai.luot[luot];
  $("#gt-nv").innerHTML = anhGt("gt-" + bai.id + "-nv", bai.nv.emoji);
  $("#gt-q-en").textContent = l.q; $("#gt-q-vi").textContent = l.qvi;
  $("#gt-a-en").textContent = l.a; $("#gt-a-vi").textContent = l.avi;
  $("#gt-a-e").innerHTML = anhGt(l.id, l.emoji);
  $("#gt-cham").innerHTML = bai.luot.map((_, i) => `<i class="${i <= luot ? "da" : ""}"></i>`).join("");
  $("#gt-xong-noi").textContent = luot === bai.luot.length - 1 ? "🎤 Con nói xong! Làm bài ⭐" : "🎤 Con nói xong rồi!";
  // nhân vật hỏi → bé nghe mẫu câu trả lời
  const k = ++chuoiAm;
  setTimeout(() => {
    if (k !== chuoiAm) return;
    const a = phat(l.id + "-q", l.q);
    a.onended = () => setTimeout(() => { if (k === chuoiAm) phat(l.id + "-a", l.a); }, 500);
  }, 400);
}
$("#gt-q").onclick = () => { chuoiAm++; const l = bai.luot[luot]; phat(l.id + "-q", l.q); };
$("#gt-a").onclick = () => { chuoiAm++; const l = bai.luot[luot]; phat(l.id + "-a", l.a); };
$("#gt-xong-noi").onclick = () => {
  chuoiAm++; phao(5); phat("_great", "Great job!");
  setTimeout(() => { if (luot < bai.luot.length - 1) { luot++; veLuot(); } else ktBai(); }, 1100);
};

function ktBai() {
  kieu = "gt"; cauGt = tron(bai.luot); soGt = 0; dungGt = 0;
  napAm(cauGt.flatMap(l => [l.id + "-q", l.id + "-a"]));
  sang("gt-kt"); veCauGt();
}
function veCauGt() {
  khoaGt = false; saiGt = false; $("#gt-dap-an").classList.remove("xong");
  const l = cauGt[soGt];
  const lua = tron([l, ...tron(bai.luot.filter(x => x.id !== l.id)).slice(0, 2)]);
  $("#gt-tien-do").style.width = (soGt / cauGt.length * 100) + "%";
  $("#gt-kt-nv").innerHTML = anhGt("gt-" + bai.id + "-nv", bai.nv.emoji);
  $("#gt-kt-q").textContent = l.q; $("#gt-kt-qvi").textContent = l.qvi;
  $("#gt-dap-an").innerHTML = lua.map(x => `<button class="lua-chon" data-id="${x.id}"><span class="em" style="${[...x.emoji].length > 3 ? "font-size:min(7vw,30px);white-space:nowrap" : ""}">${anhGt(x.id, x.emoji)}</span><b>${x.a}</b></button>`).join("");
  setTimeout(() => { if (cauGt[soGt] === l && !khoaGt) phat(l.id + "-q", l.q); }, 120);
}
$("#gt-nghe-lai").onclick = () => { const l = cauGt[soGt]; phat(l.id + "-q", l.q); };
$("#gt-dap-an").onclick = e => {
  const b = e.target.closest(".lua-chon"); if (!b || khoaGt || b.classList.contains("sai")) return;
  const l = cauGt[soGt];
  if (b.dataset.id === l.id) {
    khoaGt = true; b.classList.add("dung"); $("#gt-dap-an").classList.add("xong"); if (!saiGt) dungGt++;
    phao(12); tiengDung();
    phatLanLuot([[l.id + "-a", l.a]], () => {
      if (!$("#gt-kt").classList.contains("hien")) return;
      soGt++; soGt < cauGt.length ? veCauGt() : ketThucGt();
    });
  } else {
    saiGt = true; b.classList.add("sai"); tiengSai();
  }
};
function ketThucGt() {
  const n = dungGt >= cauGt.length - 1 ? 3 : dungGt >= cauGt.length / 2 ? 2 : 1;
  ghiSao("gt-" + bai.id, n);
  $("#sao-to").innerHTML = [0, 1, 2].map(i => `<span style="animation-delay:${i * .25}s;${i < n ? "" : "filter:grayscale(1);opacity:.3"}">⭐</span>`).join("");
  $("#xong-loi").textContent = ["", "Cố lên nào!", "Giỏi lắm!", "Xuất sắc!"][n];
  $("#xong-phu").textContent = `Bé đúng ngay ${dungGt}/${cauGt.length} câu`;
  sang("xong"); phao(24); phat("_well-done", "Well done! You did it!");
}

// ---- Xếp câu (bé lớn): xếp lại câu trả lời trong các bài Tình huống ----
let xcBai, xcDs = [], xcSo = 0, xcDung = 0, xcSai = false, xcKhoa = false;
function moXc(id) {
  xcBai = TINH_HUONG.find(b => b.id === id); kieu = "xc";
  document.body.style.setProperty("--mau", xcBai.mau);
  xcDs = tron(xcBai.luot); xcSo = 0; xcDung = 0;
  napAm(xcDs.map(l => l.id + "-a"));
  sang("xc"); veXc();
}
function veXc() {
  xcKhoa = false; xcSai = false;
  const l = xcDs[xcSo];
  const tu = l.a.split(" ").map((w, i) => ({ w, i }));
  let kho = tron(tu);
  if (kho.length > 1 && kho.every((x, j) => x.i === j)) kho.reverse();
  $("#xc-tien-do").style.width = (xcSo / xcDs.length * 100) + "%";
  $("#xc-vi").textContent = l.avi;
  $("#xc-dong").className = "xc-dong"; $("#xc-dong").innerHTML = "";
  $("#xc-kho").innerHTML = kho.map(x => `<button class="the-tu">${x.w}</button>`).join("");
  setTimeout(() => { if (xcDs[xcSo] === l && !xcKhoa) phat(l.id + "-a", l.a); }, 150);
}
const traVeKho = () => [...$("#xc-dong").children].forEach(b => $("#xc-kho").appendChild(b));
$("#xc-kho").onclick = e => { const b = e.target.closest(".the-tu"); if (!b || xcKhoa) return; $("#xc-dong").appendChild(b); kiemXc(); };
$("#xc-dong").onclick = e => { const b = e.target.closest(".the-tu"); if (!b || xcKhoa) return; $("#xc-kho").appendChild(b); };
$("#xc-nghe").onclick = () => { const l = xcDs[xcSo]; phat(l.id + "-a", l.a); };
$("#xc-xoa").onclick = () => { if (!xcKhoa) traVeKho(); };
function kiemXc() {
  if ($("#xc-kho").children.length) return;
  const l = xcDs[xcSo];
  const cauBe = [...$("#xc-dong").children].map(b => b.textContent).join(" ");
  if (cauBe === l.a) {
    xcKhoa = true; if (!xcSai) xcDung++;
    $("#xc-dong").classList.add("dung"); phao(12); tiengDung();
    phatLanLuot([[l.id + "-a", l.a]], () => {
      if (!$("#xc").classList.contains("hien")) return;
      xcSo++; xcSo < xcDs.length ? veXc() : ketThucXc();
    });
  } else {
    xcSai = true; tiengSai(); $("#xc-dong").classList.add("sai");
    setTimeout(() => { traVeKho(); $("#xc-dong").classList.remove("sai"); }, 700);
  }
}
function ketThucXc() {
  const n = xcDung >= xcDs.length - 1 ? 3 : xcDung >= xcDs.length / 2 ? 2 : 1;
  ghiSao("xc-" + xcBai.id, n);
  $("#sao-to").innerHTML = [0, 1, 2].map(i => `<span style="animation-delay:${i * .25}s;${i < n ? "" : "filter:grayscale(1);opacity:.3"}">⭐</span>`).join("");
  $("#xong-loi").textContent = ["", "Cố lên nào!", "Giỏi lắm!", "Xuất sắc!"][n];
  $("#xong-phu").textContent = `Bé xếp đúng ngay ${xcDung}/${xcDs.length} câu`;
  sang("xong"); phao(24); phat("_well-done", "Well done! You did it!");
}

veTrangChu();
</script>
